version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: economize-postgres
    environment:
      POSTGRES_DB: economize
      POSTGRES_USER: economize
      POSTGRES_PASSWORD: economize
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U economize"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: economize-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: economize
      RABBITMQ_DEFAULT_PASS: economize
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
