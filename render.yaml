# Blueprint do Render — a infra da API descrita no próprio repo.
# Ao conectar este repositório em "New > Blueprint", o Render cria o serviço com
# tudo daqui e passa a redeployar a cada push na main.
#
# Os segredos NÃO ficam neste arquivo: `sync: false` faz o Render pedir o valor
# na criação e guardá-lo no painel. O JWT_SECRET é gerado lá — assim ele nasce
# com os 256 bits que o HMAC exige e nunca passa por lugar nenhum.
services:
  - type: web
    name: economize-api
    runtime: docker
    plan: free
    # O banco está no Supabase de São Paulo (sa-east-1) e Virginia é a região
    # gratuita mais próxima dele — cada query paga essa distância
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Postgres do Supabase
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # 256 bits gerados pelo Render; trocar invalida os tokens já emitidos
      - key: JWT_SECRET
        generateValue: true
      # Origem do site estático (blueprint do repo economize-app). Se um dia houver
      # domínio próprio, ele entra aqui separado por vírgula.
      - key: CORS_ALLOWED_ORIGINS
        value: https://economize.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: BRAPI_TOKEN
        sync: false
      # O plano free tem 512 MB; sobra espaço para metaspace e threads fora da heap
      - key: JAVA_OPTS
        value: -Xms128m -Xmx360m
