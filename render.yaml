# Blueprint do Render — a infra da API descrita no próprio repo.
# Ao conectar este repositório em "New > Blueprint", o Render cria os serviços
# com tudo daqui e passa a redeployar a cada push.
#
# SÃO DOIS AMBIENTES, e a diferença entre eles é o branch:
#   economize-api          ← main      — o que o dono usa
#   economize-api-homolog  ← homolog   — onde a migration estreia
#
# O fluxo é develop → homolog → main. `main` é protegido no GitHub e só recebe
# merge com a esteira verde, então o autoDeploy dela já nasce filtrado — não há
# como um commit que quebrou o teste chegar em produção pelo caminho normal.
#
# Os segredos NÃO ficam neste arquivo: `sync: false` faz o Render pedir o valor
# na criação e guardá-lo no painel. O JWT_SECRET é gerado lá — assim ele nasce
# com os 256 bits que o HMAC exige e nunca passa por lugar nenhum.
services:
  - type: web
    name: economize-api
    runtime: docker
    plan: free
    # O banco está no Supabase de São Paulo (sa-east-1) e Virginia é a região
    # gratuita mais próxima dele — cada query paga essa distância
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # Explicito de propósito: com dois serviços no mesmo arquivo, o branch
    # deixa de ser detalhe e passa a ser a única coisa que os separa
    branch: main
    autoDeploy: true
    envVars:
      # Postgres do Supabase
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # 256 bits gerados pelo Render; trocar invalida os tokens já emitidos
      - key: JWT_SECRET
        generateValue: true
      # Origem do site estático (serviço `economize-web`, blueprint do repo
      # economize-app). Precisa ser o domínio exato: o navegador compara string,
      # não "parece o mesmo site". Domínio próprio entraria aqui após uma vírgula.
      # A lista mora AQUI, e não no painel: chave declarada com `value` é
      # gerenciada pelo arquivo, então origem adicionada a mão no Render some na
      # proxima sincronizacao do blueprint — ja aconteceu neste projeto em 15/08.
      # O localhost esta na lista porque o app roda local contra esta API durante
      # os testes; TIRAR antes do lancamento publico.
      - key: CORS_ALLOWED_ORIGINS
        value: https://economize-web.onrender.com,http://localhost:8081,http://localhost:19006
      # A documentacao da API sai do ar AQUI, e so aqui. Medido em 16/09/2026:
      # o metaspace estava em 118 MB de 128, e o springdoc e um dos maiores
      # inquilinos — ele carrega o WebJar da interface e monta o modelo inteiro
      # (120 rotas, 161 schemas) na primeira chamada, e guarda dali em diante.
      # Em troca, o contrato virou arquivo versionado (docs/openapi.json,
      # conferido pela esteira a cada push) e o site publica ele. Quem avalia
      # continua vendo a documentacao; a producao para de pagar por ela.
      - key: SPRINGDOC_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: BRAPI_TOKEN
        sync: false
      # EC-107: cifra, no banco, a chave de IA que cada usuário cadastra.
      # `sync: false` e não `generateValue: true` como o JWT_SECRET, por um
      # motivo concreto: aqui o formato é rígido — exatamente 32 bytes em Base64,
      # que é o que AES-256 exige — e a API se RECUSA a subir com uma chave-mestra
      # de outro tamanho (chave torta cifra segredo que ninguém abre depois).
      # Um gerador que produzisse qualquer outro tamanho derrubaria o deploy.
      # Gere e cole:  openssl rand -base64 32
      # Deixar em branco é uma resposta válida: a API sobe igual, a opção de
      # chave própria some do app e todo mundo segue na chave do servidor.
      # TROCAR ESTE VALOR TORNA AS CHAVES JÁ CADASTRADAS ILEGÍVEIS — a API avisa
      # (keyStatus=UNREADABLE) e pede recadastro, mas nada é recuperável.
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      # As duas abaixo existem para a ROTAÇÃO ser possível sem downtime, e estão
      # declaradas aqui já com o valor de repouso justamente para ninguém ter de
      # descobrir, no dia da troca, que precisa criá-las.
      #
      # Nome da chave ativa. Fica gravado dentro de cada segredo, então é ele que
      # diz qual chave-mestra abre qual linha. Ao rotacionar, escolha um nome
      # novo (k2, producao-2027...) junto com o valor novo de SECRET_ENCRYPTION_KEY.
      - key: SECRET_ENCRYPTION_KEY_ID
        value: k1
      # Chaves ANTIGAS, só para leitura, no formato id:base64,id:base64. Durante
      # uma rotação a chave que saiu de cena vive aqui até o último segredo ter
      # sido reescrito com a nova; acompanhe o saldo no SQL do Supabase com
      #   SELECT master_key_id, count(*) FROM user_ai_settings GROUP BY 1;
      # e só então esvazie esta variável. Tirar a chave antiga antes da hora
      # torna ilegíveis as linhas que ainda estavam nela.
      - key: SECRET_ENCRYPTION_PREVIOUS_KEYS
        sync: false
      # ----------------------------------------------------------------------
      # Variaveis que vivem SO no painel do Render, de proposito
      #
      # Nao entram aqui como `sync: false` porque adicionar chave nova nessa forma
      # a um servico que ja existe faz o Render exigir valor antes de deployar, e
      # um valor vazio em MAIL_PORT (int) ou MAIL_ENABLED (boolean) derruba o boot.
      # Todas tem default seguro em application.properties: ausentes, a API sobe.
      #
      #   MAIL_ENABLED / MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD
      #     Sem elas, "esqueci minha senha" responde 202 e NAO envia e-mail —
      #     o LogEmailSender so registra o link no log. Para valer, MAIL_ENABLED=true.
      #   RESET_URL_BASE   default ja aponta para o site publicado.
      #   PLUGGY_ENABLED / PLUGGY_CLIENT_ID / PLUGGY_CLIENT_SECRET /
      #   PLUGGY_ITEM_IDS / PLUGGY_OWNER_EMAIL
      #     Cadastradas a mao em 15/08; conferir depois de cada sync do blueprint.
      # ----------------------------------------------------------------------
      # O plano free tem 512 MB — e o que estoura NAO e o heap do Java, e o
      # LIMITE DO CONTAINER. Com -Xmx360m a conta so fechava ignorando tudo o
      # que vive fora do heap: metaspace (~120 MB num Spring Boot deste
      # tamanho), code cache, buffers diretos da Netty e a pilha de cada
      # thread. Somados, passavam de 512 MB e o processo era MORTO pelo
      # sistema — 05/09, o sync do Pluggy derrubou a API e o Render levou
      # quatro minutos respondendo 503 (x-render-routing: hibernate-wake-error)
      # ate reerguer o container.
      #
      # A diferenca que estes valores fazem: com o teto abaixo do limite do
      # container, faltar memoria vira UMA requisicao com erro 500 (que o Java
      # sabe reportar e da qual ele se recupera) em vez do servico inteiro
      # caindo para todo mundo.
      #
      #   Xmx256m ............ teto EXPLICITO, e nao percentual: medido em
      #                        producao, MaxRAMPercentage=50 resolveu 348 MB —
      #                        a JVM enxerga mais memoria do que o container
      #                        tem de fato, e o percentual mirava no numero
      #                        errado justamente no ponto que se queria corrigir
      #   MaxMetaspaceSize ... teto explicito; sem ele o metaspace cresce ate o
      #                        container acabar
      #   MaxDirectMemorySize  a Netty aloca fora do heap e, sem teto, ignora o Xmx
      #   Xss512k ............ ~30 threads do boundedElastic a 1 MB era 1 MB por
      #                        thread desperdicado
      #   UseSerialGC ........ heap pequeno em 0,1 CPU: o G1 cobra mais em
      #                        estruturas e threads de GC do que devolve aqui
      #
      # SEGUNDA RODADA — 15/09/2026. O Render avisou de novo: "economize-api
      # exceeded its memory limit", com reinicio automatico e a instancia fora
      # do ar durante ele. Ou seja: os tetos acima somavam pouco menos que 512
      # MB e nao sobrava folga para o que a JVM commita sem perguntar.
      #
      # O que faltava no orcamento anterior era o CODE CACHE. Ele nao aparece
      # em nenhum -Xmx e cresce com o JIT: o padrao RESERVA 240 MB e vai
      # commitando conforme compila. Numa API que ja rodou um tempo, sao
      # dezenas de MB que ninguem estava contando.
      #
      # Conta nova, com folga de proposito:
      #   heap 224 + metaspace 128 + direto 32 + code cache 48 + ~40 threads a
      #   512k (20) + estruturas da JVM (~25) = ~477 MB. Sobram ~35 MB.
      #
      #   ReservedCodeCacheSize  o teto que faltava
      #   ExitOnOutOfMemoryError faltar memoria passa a MATAR o processo na
      #                          hora, e o Render reergue limpo. Sem isso a JVM
      #                          fica minutos em GC sem sair do lugar,
      #                          respondendo lentissimo — pior que cair
      #
      # SUSPEITO A INVESTIGAR, e vale medir antes de cortar: o springdoc monta
      # o modelo inteiro do OpenAPI (117 rotas, 158 schemas) NA PRIMEIRA vez
      # que alguem abre /v3/api-docs ou /swagger-ui, e guarda em memoria dali
      # em diante. Num container de 512 MB isso levanta o piso de forma
      # permanente por uma pagina que so o desenvolvedor abre.
      #
      # TERCEIRA RODADA — 16/09/2026, e desta vez o numero errado era MEU.
      #
      # O Render avisou "Exited with status 3". Status 3 e exatamente o codigo
      # que o -XX:+ExitOnOutOfMemoryError acima produz: a JVM viu
      # OutOfMemoryError e saiu na hora, de proposito. A flag funcionou; o teto
      # e que estava apertado demais.
      #
      # MEDIDO pelo actuator na instancia reiniciada (7 leituras em 6 minutos,
      # uptime subindo, sem reinicio no meio):
      #   heap ........ teto 216,6 MB   em uso 112-122 MB
      #   Metaspace ... teto 128,0 MB   em uso 118,0 MB  <-- 92% do teto
      #   CodeCache ... teto  48,0 MB   em uso  30,0 MB
      #   committed total: 382 MB de JVM + pilhas + nativo = 440-470 de 512
      #
      # A rodada anterior BAIXOU o MaxMetaspaceSize de 140m (o que estava no
      # painel) para 128m. Metaspace nao e compressivel: e quantas classes o
      # Spring carrega, e a aplicacao precisa de 118 so para subir. Sobravam
      # 10 MB, e qualquer classe carregada tarde (rota ainda nao tocada, proxy,
      # serializador de DTO) estourava.
      #
      # A correcao nao e somar memoria — e TIRAR DO HEAP E DAR AO METASPACE.
      # O heap tinha 216 de teto para 122 de uso; o metaspace nao tinha folga
      # nenhuma.
      #   heap 192 + metaspace 176 + direto 32 + code cache 40
      #   + ~40 threads a 512k (20) + estruturas da JVM (~25) = ~485 de teto,
      #   com committed real perto de 355 + nativo.
      #
      # Nao entra -XX:+HeapDumpOnOutOfMemoryError: o dump nao caberia no disco
      # efemero e, num estouro de metaspace, nao e o artefato util.
      - key: JAVA_OPTS
        value: -Xmx192m -XX:MaxMetaspaceSize=176m -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=40m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError

  # --------------------------------------------------------------------------
  # HOMOLOGAÇÃO — o ambiente onde a migration estreia
  #
  # A diferença que ele faz: até aqui, toda migration nova estreava contra a
  # conta que o dono usa de verdade. Agora ela roda primeiro num banco que pode
  # quebrar sem consequência, com dados de teste, e só depois vai para `main`.
  #
  # O banco é criado pelo próprio blueprint (ver `databases` no fim do arquivo),
  # então não há URL para colar à mão. O Render entrega os dados campo a campo,
  # e o `application.properties` monta a URL JDBC a partir deles quando DB_URL
  # não vem preenchida — produção continua usando DB_URL, como sempre.
  # --------------------------------------------------------------------------
  - type: web
    name: economize-api-homolog
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    branch: homolog
    # Aqui o autoDeploy é para valer: o objetivo do ambiente é justamente ver o
    # que acabou de ser mergeado, o quanto antes
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: economize-homolog-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: economize-homolog-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: economize-homolog-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: economize-homolog-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: economize-homolog-db
          property: password
      # Segredo PRÓPRIO, e não o de produção: token emitido em homologação não
      # pode valer na conta do dono. É o mesmo motivo de o banco ser outro
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://economize-web-homolog.onrender.com,http://localhost:8081,http://localhost:19006
      # LIGADO aqui de proposito: homologacao e onde se abre o Swagger para
      # conferir uma rota nova antes de ela virar producao, e o ambiente nao
      # atende usuario de verdade
      - key: SPRINGDOC_ENABLED
        value: "true"
      # As chaves de terceiros ficam VAZIAS de propósito. A API sobe sem elas —
      # o mercado cai para as fontes gratuitas e a IA fica desligada —, e gastar
      # cota de API paga com tráfego de homologação seria pagar duas vezes pela
      # mesma coisa. Preencha no painel se precisar testar exatamente esse ponto.
      - key: GEMINI_API_KEY
        value: ""
      - key: BRAPI_TOKEN
        value: ""
      # Cifra de segredo do usuário desligada aqui: sem ela a opção de chave
      # própria some do app e todo mundo segue na chave do servidor, que é um
      # cenário válido e o que se quer em homologação
      - key: SECRET_ENCRYPTION_KEY
        value: ""
      - key: SECRET_ENCRYPTION_KEY_ID
        value: k1
      - key: SECRET_ENCRYPTION_PREVIOUS_KEYS
        value: ""
      # Conector bancário DESLIGADO: homologação não pode tocar em conta real de
      # ninguém, e o Pluggy só tem os itens do dono
      - key: PLUGGY_ENABLED
        value: "false"
      # Mesmo teto de memória de produção: um ambiente que não reproduz o limite
      # não serve para descobrir que a memória estourou
      #
      # SEGUNDA RODADA — 15/09/2026. O Render avisou de novo: "economize-api
      # exceeded its memory limit", com reinicio automatico e a instancia fora
      # do ar durante ele. Ou seja: os tetos acima somavam pouco menos que 512
      # MB e nao sobrava folga para o que a JVM commita sem perguntar.
      #
      # O que faltava no orcamento anterior era o CODE CACHE. Ele nao aparece
      # em nenhum -Xmx e cresce com o JIT: o padrao RESERVA 240 MB e vai
      # commitando conforme compila. Numa API que ja rodou um tempo, sao
      # dezenas de MB que ninguem estava contando.
      #
      # Conta nova, com folga de proposito:
      #   heap 224 + metaspace 128 + direto 32 + code cache 48 + ~40 threads a
      #   512k (20) + estruturas da JVM (~25) = ~477 MB. Sobram ~35 MB.
      #
      #   ReservedCodeCacheSize  o teto que faltava
      #   ExitOnOutOfMemoryError faltar memoria passa a MATAR o processo na
      #                          hora, e o Render reergue limpo. Sem isso a JVM
      #                          fica minutos em GC sem sair do lugar,
      #                          respondendo lentissimo — pior que cair
      #
      # SUSPEITO A INVESTIGAR, e vale medir antes de cortar: o springdoc monta
      # o modelo inteiro do OpenAPI (117 rotas, 158 schemas) NA PRIMEIRA vez
      # que alguem abre /v3/api-docs ou /swagger-ui, e guarda em memoria dali
      # em diante. Num container de 512 MB isso levanta o piso de forma
      # permanente por uma pagina que so o desenvolvedor abre.
      #
      # TERCEIRA RODADA — 16/09/2026, e desta vez o numero errado era MEU.
      #
      # O Render avisou "Exited with status 3". Status 3 e exatamente o codigo
      # que o -XX:+ExitOnOutOfMemoryError acima produz: a JVM viu
      # OutOfMemoryError e saiu na hora, de proposito. A flag funcionou; o teto
      # e que estava apertado demais.
      #
      # MEDIDO pelo actuator na instancia reiniciada (7 leituras em 6 minutos,
      # uptime subindo, sem reinicio no meio):
      #   heap ........ teto 216,6 MB   em uso 112-122 MB
      #   Metaspace ... teto 128,0 MB   em uso 118,0 MB  <-- 92% do teto
      #   CodeCache ... teto  48,0 MB   em uso  30,0 MB
      #   committed total: 382 MB de JVM + pilhas + nativo = 440-470 de 512
      #
      # A rodada anterior BAIXOU o MaxMetaspaceSize de 140m (o que estava no
      # painel) para 128m. Metaspace nao e compressivel: e quantas classes o
      # Spring carrega, e a aplicacao precisa de 118 so para subir. Sobravam
      # 10 MB, e qualquer classe carregada tarde (rota ainda nao tocada, proxy,
      # serializador de DTO) estourava.
      #
      # A correcao nao e somar memoria — e TIRAR DO HEAP E DAR AO METASPACE.
      # O heap tinha 216 de teto para 122 de uso; o metaspace nao tinha folga
      # nenhuma.
      #   heap 192 + metaspace 176 + direto 32 + code cache 40
      #   + ~40 threads a 512k (20) + estruturas da JVM (~25) = ~485 de teto,
      #   com committed real perto de 355 + nativo.
      #
      # Nao entra -XX:+HeapDumpOnOutOfMemoryError: o dump nao caberia no disco
      # efemero e, num estouro de metaspace, nao e o artefato util.
      - key: JAVA_OPTS
        value: -Xmx192m -XX:MaxMetaspaceSize=176m -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=40m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError

# ----------------------------------------------------------------------------
# O banco de homologação. Fica no Render, e não no Supabase, por dois motivos:
# ele nasce junto com o serviço (nada para criar à mão) e não divide instância
# nenhuma com o banco que guarda o extrato de verdade do dono.
#
# ATENÇÃO ao plano gratuito: o Postgres free do Render EXPIRA (hoje, 30 dias) e
# some. Isso é aceitável aqui — homologação não guarda nada que precise durar —,
# mas quando ele expirar o serviço vai parar de subir até o banco ser recriado.
# Recriar é apagar a entrada no painel e sincronizar o blueprint de novo; o
# Flyway remonta o schema inteiro no primeiro boot.
# ----------------------------------------------------------------------------
databases:
  - name: economize-homolog-db
    plan: free
    region: virginia
    databaseName: economize_homolog
    user: economize
